spring:
  application:
    name: job-monitor

  datasource:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys = ON
      data-source-properties:
        busy_timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

job-monitor:
  data-directory: ${JOB_MONITOR_DATA_DIR:}

server:
  address: 127.0.0.1
  port: 8080
