<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"selfRequestsOnly":true}'>
  <title th:text="${title} + ' · Job Monitor'">Job Monitor</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/htmx.min.js}"></script><script defer th:src="@{/js/app.js}"></script>
</head>
<body hx-indicator="#loading" hx-disabled-elt="find button[type='submit']">
<a class="skip-link" href="#main">Перейти к содержимому</a>
<aside class="sidebar">
  <a class="brand" th:href="@{/}"><span class="brand-icon">J<span>•</span></span> Job Monitor</a>
  <p class="eyebrow">LOCAL WORKSPACE</p>
  <nav aria-label="Основная навигация">
    <a th:href="@{/}" th:attr="aria-current=${path == '/' ? 'page' : null}"><span aria-hidden="true">◫</span> Dashboard</a>
    <a th:href="@{/searches}" th:attr="aria-current=${path.startsWith('/searches') ? 'page' : null}"><span aria-hidden="true">⌕</span> Search Queries</a>
    <a th:href="@{/vacancies}" th:attr="aria-current=${path.startsWith('/vacancies') ? 'page' : null}"><span aria-hidden="true">▤</span> Vacancies</a>
    <a th:href="@{/collections}" th:attr="aria-current=${path.startsWith('/collections') ? 'page' : null}"><span aria-hidden="true">↻</span> Collection History</a>
    <a th:href="@{/settings}" th:attr="aria-current=${path == '/settings' ? 'page' : null}"><span aria-hidden="true">⚙</span> Settings</a>
  </nav>
  <div class="sidebar-footer"><span class="local-dot"></span> Только на этом устройстве<br><small>SQLite · 127.0.0.1</small></div>
</aside>
<div class="workspace">
  <header class="topbar"><span>Рабочее пространство <span class="muted">/</span> <strong th:text="${title}"></strong></span>
    <label class="theme-label" for="theme">Тема <select id="theme"><option value="system">Системная</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label>
  </header>
  <div id="loading" class="htmx-indicator" role="status">Обновление…</div>
  <main id="main" tabindex="-1">
    <div id="notice" aria-live="polite" aria-atomic="true"><th:block th:replace="~{fragments/notice :: notice}"></th:block></div>
    <th:block th:replace="${content}"></th:block>
  </main>
  <footer>Job Monitor <span>Данные хранятся локально · Время: <span th:text="${@display.zone()}"></span></span></footer>
</div>
</body></html>
